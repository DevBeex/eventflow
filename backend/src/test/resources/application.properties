quarkus.datasource.devservices.enabled=true
quarkus.datasource.devservices.image-name=postgres:16.6

# Kafka-compatible broker for Quarkus Dev Services (compose demo still uses apache/kafka:3.8.1)
quarkus.kafka.devservices.enabled=true
quarkus.kafka.devservices.provider=redpanda
quarkus.kafka.devservices.image-name=docker.redpanda.com/redpandadata/redpanda:v24.2.4

quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=validate

mp.messaging.incoming.order-created-in.auto.offset.reset=earliest
mp.messaging.incoming.order-created-in.throttled.unprocessed-record-max-age.ms=2147483647

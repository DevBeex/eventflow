quarkus.application.name=eventflow

# HTTP
quarkus.http.port=${HTTP_PORT:8080}

# PostgreSQL (credentials shared; JDBC URL only in prod so Dev Services work in test/dev)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:eventflow}
quarkus.datasource.password=${DB_PASSWORD:eventflow}
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:eventflow}

# Hibernate / Flyway
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true

# Jackson
quarkus.jackson.fail-on-unknown-properties=true

# OpenAPI
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui

# Kafka bootstrap only in prod (Dev Services supply brokers in test/dev)
%prod.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Outbox publisher outgoing channel
mp.messaging.outgoing.order-created-out.connector=smallrye-kafka
mp.messaging.outgoing.order-created-out.topic=order-created
mp.messaging.outgoing.order-created-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.order-created-out.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.order-created-out.acks=all
mp.messaging.outgoing.order-created-out.enable.idempotence=true
mp.messaging.outgoing.order-created-out.linger.ms=0
mp.messaging.outgoing.order-created-out.max.block.ms=10000
mp.messaging.outgoing.order-created-out.delivery.timeout.ms=15000
mp.messaging.outgoing.order-created-out.request.timeout.ms=10000

# Notification consumer incoming channel
mp.messaging.incoming.order-created-in.connector=smallrye-kafka
mp.messaging.incoming.order-created-in.topic=order-created
mp.messaging.incoming.order-created-in.group.id=eventflow-notifications-v1
mp.messaging.incoming.order-created-in.enable.auto.commit=false
mp.messaging.incoming.order-created-in.auto.offset.reset=earliest
mp.messaging.incoming.order-created-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.order-created-in.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.order-created-in.failure-strategy=fail
mp.messaging.incoming.order-created-in.commit-strategy=throttled

# Logging
quarkus.log.category."com.eventflow".level=INFO
